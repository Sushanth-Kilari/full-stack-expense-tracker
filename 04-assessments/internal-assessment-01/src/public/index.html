<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split Bill Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <h1>Split Bill Calculator</h1>

    <form id="splitForm" novalidate>
      <label for="total">Bill total (Rs.)</label>
      <input type="number" id="total" min="1" step="0.01" required>

      <label for="people">Number of people</label>
      <input type="number" id="people" min="1" step="1" value="2" required>

      <label for="tip">Tip (%)</label>
      <input type="number" id="tip" min="0" max="100" value="10">

      <button type="submit">Calculate</button>
    </form>

    <p id="error" class="error" role="alert"></p>

    <section id="result" hidden>
      <h2>Result</h2>
      <table>
        <tr><th>Bill</th><td id="rTotal"></td></tr>
        <tr><th>Tip</th><td id="rTip"></td></tr>
        <tr><th>Grand total</th><td id="rGrand"></td></tr>
        <tr class="highlight"><th>Each person pays</th><td id="rEach"></td></tr>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
