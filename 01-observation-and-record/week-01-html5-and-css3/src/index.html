<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 01 - HTML5 &amp; CSS3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>ExpenseWise</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="card-row">
      <article class="card"><h2>Track</h2><p>Record every expense the moment it happens.</p></article>
      <article class="card"><h2>Categorise</h2><p>Group spending into Food, Travel, Bills and more.</p></article>
      <article class="card"><h2>Review</h2><p>See where your money goes each month.</p></article>
    </section>

    <section>
      <h2>Add Expense</h2>
      <form action="#" method="post">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required maxlength="80">

        <label for="amount">Amount (INR)</label>
        <input type="number" id="amount" name="amount" min="1" step="0.01" required>

        <label for="category">Category</label>
        <select id="category" name="category">
          <option>Food</option>
          <option>Travel</option>
          <option>Bills</option>
          <option>Shopping</option>
        </select>

        <label for="date">Date</label>
        <input type="date" id="date" name="date" required>

        <button type="submit">Save Expense</button>
      </form>
    </section>
  </main>

  <footer><p>&copy; 2026 ExpenseWise</p></footer>
</body>
</html>
